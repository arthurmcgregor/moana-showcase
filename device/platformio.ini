; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-cores3

; Pinned platform, shared by every ESP32 env below ([env:native] overrides it
; with platform = native). Keep the pin in this one place — a per-env pin drifts,
; and a sketch env quietly building against a different IDF than production is
; worse than no pin at all.
;
; 6.12.0 is the last release of platformio/espressif32; Espressif stopped
; maintaining the PlatformIO platform there, so this pin is also the ceiling of
; the official registry. It resolves to arduino-esp32 2.0.17 / IDF 4.4.7 —
; the same thing the previous unpinned `espressif32` resolved to, so pinning
; changes nothing about what gets built, only that it stays reproducible.
;
; This firmware and watch/ exchange ESP-NOW packets (shared/espnow_protocol.h),
; so their IDF majors must match. watch/platformio.ini is pinned to
; espressif32@6.10.0 (also IDF 4.4) and cannot move up on its own: LilyGoLib
; master needs IDF 5 display APIs, and the ESP-NOW receive callback signature
; changed in IDF 5 (`const uint8_t* mac` → `const esp_now_recv_info_t* info`).
; Reaching IDF 5.x means switching both projects to the pioarduino platform
; fork in one go — never bump just this file.
[env]
platform = espressif32@6.12.0

[env:m5stack-cores3]
board = m5stack-cores3
framework = arduino
lib_deps =
	bblanchon/ArduinoJson
	ESP32Async/AsyncTCP
	ESP32Async/ESPAsyncWebServer
	ESPmDNS
	m5stack/M5Unified
    mikalhart/TinyGPSPlus
	adafruit/Adafruit AHRS
	adafruit/Adafruit Unified Sensor
platform_packages =
	tool-esptoolpy@platformio/tool-esptoolpy
extra_scripts =
	pre:scripts/pre_build.py
board_build.filesystem = littlefs
board_build.f_cpu = 160000000L
build_flags = -std=gnu++17 -Wall -Wextra -I ../shared
build_unflags = -std=gnu++11
[env:device-test]
board = m5stack-cores3
framework = arduino
lib_deps =
    m5stack/M5Unified
platform_packages =
    tool-esptoolpy@platformio/tool-esptoolpy
board_build.filesystem = littlefs
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
build_src_filter =
    -<*>
    +<storage/storage.cpp>
    +<recording/gps_csv.cpp>
    +<utils/logger.cpp>
test_build_src = true
test_filter = test_device

[env:native]
platform = native
build_flags =
    -std=gnu++17
    -I test/stubs
    -I include
    -I ../shared
build_src_filter =
    -<*>
    +<recording/recording_state_machine.cpp>
    +<recording/gps_csv.cpp>
    +<recording/recording_session.cpp>
    +<recording/distance_accumulator.cpp>
    +<events/app_controller.cpp>
    +<events/event_ingest.cpp>
    +<utils/state_strings.cpp>
    +<storage/storage.cpp>
    +<ui/display.cpp>
    +<ui/screen_context.cpp>
lib_deps = google/googletest
test_framework = googletest
test_build_src = true
test_filter = test_native

[env:littlefs-sketch]
board = m5stack-cores3
framework = arduino
build_src_filter = -<*> +<../littlefs_sketch.cpp>
board_build.filesystem = littlefs
monitor_speed = 115200

[env:espnow-sketch]
board = m5stack-cores3
framework = arduino
lib_deps =
	mikalhart/TinyGPSPlus
build_src_filter = -<*> +<../espnow_sketch.cpp>
board_build.filesystem = littlefs
build_flags = -std=gnu++17 -I ../shared
build_unflags = -std=gnu++11
monitor_speed = 115200

[env:imu-sketch]
board = m5stack-cores3
framework = arduino
lib_deps =
	m5stack/M5Unified
	adafruit/Adafruit AHRS
	adafruit/Adafruit Unified Sensor
build_src_filter = -<*> +<../imu_sketch.cpp>
board_build.filesystem = littlefs
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
monitor_speed = 115200
