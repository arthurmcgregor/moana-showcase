; T-Watch Ultra scoping firmware.
;
; Environment mirrors Xinyuan-LilyGO/LilyGoLib-PlatformIO (the supported
; PlatformIO route for LilyGoLib): pinned espressif32 platform, vendor board
; JSON in boards/, vendor variant pin map in variants/. Do not upgrade the
; platform or dependency pins without re-verifying against that repo.

[platformio]
default_envs = twatch_ultra
boards_dir = boards

; Native unit tests (mirrors device/platformio.ini [env:native]): googletest
; over the pure modules only — no Arduino, no LVGL, no radio. Run with
; `pio test -e native`.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -I src
    -I ../shared
build_src_filter =
    -<*>
    +<alerts.cpp>
    +<command_channel.cpp>
    +<event_queue.cpp>
    +<nz_time.cpp>
    +<stats_engine.cpp>
    +<timebase.cpp>
lib_deps = google/googletest
test_framework = googletest
test_build_src = true
test_filter = test_native

[env:twatch_ultra]
platform = espressif32@6.10.0
framework = arduino
board = lilygo-t-watch-ultra
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = fatfs
board_build.partitions = partitions.csv
monitor_filters =
    default
    esp32_exception_decoder
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_T_WATCH_S3_ULTRA
    -D ARDUINO_LILYGO_LORA_SX1262
    -I variants/lilygo_twatch_ultra
    -I ../shared
    -Wnarrowing
    ; Trim RadioLib to the SX126x family fitted in this (915MHz) variant
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_BELL
; Every dependency is pinned to an exact version or commit — no caret ranges.
; This firmware builds against a frozen IDF 4.4 toolchain, and its deps
; (LilyGoLib especially) move fast enough that a float will eventually pull in
; something that doesn't compile. When bumping any pin, bump it deliberately
; and re-verify against LilyGoLib-PlatformIO.
lib_deps =
    ; Pinned: master moved to IDF 6 display APIs (e865cd18, 2026-06) which
    ; don't compile against espressif32@6.10.0 (IDF 4.4). This is the last
    ; commit before that change.
    https://github.com/Xinyuan-LilyGO/LilyGoLib.git#2eadcf7239a0e69fcfa37e6e8714eb611faa7b5c
    lvgl/lvgl @ 9.5.0
    jgromes/RadioLib @ 7.7.1
    lewisxhe/XPowersLib @ 0.3.3
    lewisxhe/SensorLib @ 0.3.4
    mikalhart/TinyGPSPlus @ 1.1.0
    earlephilhower/ESP8266Audio @ 2.0.0
    h2zero/NimBLE-Arduino @ 2.5.0
    ; Bundled with arduino-esp32; version follows the pinned platform above.
    ESP32 BLE Arduino
    https://github.com/lewisxhe/ESP32-BLE-Keyboard-fork.git#20c8b9f1f3e01742c16110a6753ac95ee2b1c0ba
    https://github.com/lewisxhe/ESP32-BLE-Mouse-fork.git#61bcd326fff51efda7f20593fbf0993e72e70ff4
    https://github.com/lewisxhe/ST25R3916-fork.git#0c8e00f49d12881d1cff6d6f0879b90ce7ed4033
    https://github.com/lewisxhe/NFC-RFAL-fork.git#7bde4587ea44c36c178a43d083d7a7345c1e4cfe
