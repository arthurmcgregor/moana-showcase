name: CI

# Runs the native firmware tests, the Django suite and the frontend tests.
# Each job mirrors the command a developer runs locally (see the CLAUDE.md files)
# so a green CI and a green laptop mean the same thing.
#
# Work lands straight on main (root CLAUDE.md, "Git workflow"), so push-to-main
# is the trigger that matters and CI reports regressions rather than gating them.
# pull_request covers the occasional parked branch; workflow_dispatch is for
# re-running a job by hand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure-logic unit tests: googletest on the host, no toolchain download.
  # Fast enough to be the first signal on every push.
  firmware-native-tests:
    name: native tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [device, watch]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-native-${{ matrix.project }}-${{ hashFiles(format('{0}/platformio.ini', matrix.project)) }}
          restore-keys: pio-native-${{ matrix.project }}-

      - run: pip install platformio

      - name: pio test -e native
        working-directory: ${{ matrix.project }}
        run: pio test -e native

  # Firmware compiles. Catches the failures native tests structurally cannot:
  # LVGL/Arduino/M5Unified API drift, dependency-pin breakage, and flash/RAM
  # regressions (the size report is echoed into the job summary).
  firmware-build:
    name: build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: device
            env: m5stack-cores3
          - project: watch
            env: twatch_ultra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-build-${{ matrix.env }}-${{ hashFiles(format('{0}/platformio.ini', matrix.project)) }}
          restore-keys: pio-build-${{ matrix.env }}-

      - run: pip install platformio

      # device/ needs wifi_secrets.cpp to link. The committed copy holds
      # placeholders; CI supplies a dummy if it is ever untracked.
      - name: Stub WiFi secrets if absent
        if: matrix.project == 'device'
        run: |
          f=device/src/connectivity/wifi_secrets.cpp
          if [ ! -f "$f" ]; then
            cat > "$f" <<'EOF'
          #include "connectivity/wifi_secrets.h"
          const char* home_ssid = "ci-stub";
          const char* home_password = "ci-stub-password";
          const char* phone_ssid = "ci-stub";
          const char* phone_password = "ci-stub-password";
          const char* ap_ssid = "ci-stub";
          const char* ap_password = "ci-stub-password";
          EOF
            echo "wrote stub $f"
          fi

      - name: pio run
        working-directory: ${{ matrix.project }}
        run: pio run -e ${{ matrix.env }} 2>&1 | tee build.log

      - name: Report flash/RAM usage
        working-directory: ${{ matrix.project }}
        run: |
          {
            echo "### ${{ matrix.env }} size"
            echo '```'
            grep -E '^(RAM|Flash):' build.log || echo "no size report found"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  server:
    name: server (pytest + PostGIS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: server/requirements.txt

      # GeoDjango links against these at import time.
      - name: Install GDAL/GEOS/PROJ
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils gdal-bin libgdal-dev libgeos-dev libproj-dev libpq-dev

      # scripts/run-tests.sh calls .venv/bin/python directly, so create the venv
      # where it expects rather than duplicating the pytest invocation here.
      - name: Create venv and install requirements
        working-directory: server
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      # Brings up the ephemeral PostGIS DB from docker-compose.test.yml (which
      # installs the postgis extension into template1) and runs the suite.
      - name: Run tests
        working-directory: server
        run: scripts/run-tests.sh

      - name: Tear down test DB
        if: always()
        working-directory: server
        run: scripts/run-tests.sh --down

  frontend:
    name: frontend (type-check + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run test
        working-directory: frontend

      # `npm run build` runs type-check and vite build in parallel, so this
      # covers vue-tsc too.
      - run: npm run build
        working-directory: frontend
        env:
          VITE_APP_VERSION: ci
